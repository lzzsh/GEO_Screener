<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEO Search Debug</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --panel: rgba(255, 255, 255, 0.85);
        --text: #1f2933;
        --muted: #52606d;
        --accent: #0f766e;
        --border: rgba(15, 118, 110, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 32%),
          radial-gradient(circle at bottom right, rgba(180, 83, 9, 0.18), transparent 28%),
          linear-gradient(135deg, #f8f5ef 0%, #ebe3d3 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(760px, 100%);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 80px rgba(31, 41, 51, 0.14);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3.75rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .status {
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(15, 118, 110, 0.16);
        color: var(--accent);
        font-size: 0.95rem;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 8px rgba(15, 118, 110, 0.14);
      }

      code {
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.1);
      }
    </style>
  </head>
  <body>
    <main>
      <p>Local Debug Page</p>
      <h1>GEO Search</h1>
      <p>当前仓库还没实现完整前端，这里先提供一个可调试入口，确认静态资源和 FastAPI 页面服务都正常。</p>
      <div class="status">
        <span class="dot"></span>
        <span>页面已加载，脚本入口：<code>/static/app.js</code></span>
      </div>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
