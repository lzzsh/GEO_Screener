<!DOCTYPE html>
<html lang="en" x-data="appState()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}GEO Screener{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex">
  <!-- Left Sidebar -->
  <aside class="w-48 bg-white border-r border-gray-200 fixed h-full flex flex-col z-10">
    <div class="px-5 py-5 border-b border-gray-100">
      <a href="/search" class="font-semibold text-blue-600 text-base">GEO Screener</a>
    </div>
    <nav class="flex-1 py-2 overflow-y-auto">
      <a href="/search" class="block px-5 py-3 text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900">论文列表</a>
      <a href="/tasks-list" class="block px-5 py-3 text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900">任务管理</a>
      <a href="/library" class="block px-5 py-3 text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900">文献库</a>
      <a href="/criteria-page" class="block px-5 py-3 text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900">配置管理</a>
      <a href="/settings" class="block px-5 py-3 text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900">Settings</a>
    </nav>
    <div class="px-5 py-4 border-t border-gray-100">
      <button @click="logout()" class="text-sm text-red-500 hover:text-red-700">退出登录</button>
    </div>
  </aside>
  <!-- Main Content -->
  <main class="ml-48 flex-1 px-6 py-6 min-w-0">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
