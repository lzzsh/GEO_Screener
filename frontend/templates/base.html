<!DOCTYPE html>
<html lang="en" x-data="appState()" x-init="init()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}GEO Screener{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <a href="/search" class="font-semibold text-blue-600 text-lg">GEO Screener</a>
    <div class="flex gap-4 text-sm">
      <a href="/search" class="hover:text-blue-600">Search</a>
      <a href="/tasks-list" class="hover:text-blue-600">Tasks</a>
      <a href="/criteria-page" class="hover:text-blue-600">Criteria</a>
      <a href="/settings" class="hover:text-blue-600">Settings</a>
      <button @click="logout()" class="text-red-500 hover:text-red-700">Logout</button>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
