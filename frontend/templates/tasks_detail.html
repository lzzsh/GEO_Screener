{% extends "base.html" %}
{% block title %}Task Detail — GEO Screener{% endblock %}
{% block content %}
<div x-data="taskDetailPage({{ task_id }})" x-init="init()">
  <!-- GSM Detail Modal -->
  <div x-show="gsmModal.open" class="fixed inset-0 flex items-center justify-center p-4"
       @click.self="gsmModal.open=false" style="z-index:60">
    <div class="absolute inset-0 bg-black/50"></div>
    <div class="relative bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto" style="z-index:61">
      <div class="sticky top-0 bg-white border-b px-8 py-5 flex justify-between items-start" style="z-index:62">
        <div>
          <p class="font-mono text-sm text-blue-600 font-semibold" x-text="gsmModal.id"></p>
          <p class="text-xl font-bold text-gray-900 mt-1 leading-snug" x-text="gsmModal.data?.title || '—'"></p>
        </div>
        <button @click="gsmModal.open=false" class="text-gray-400 hover:text-gray-600 text-2xl leading-none ml-6 mt-1">✕</button>
      </div>
      <div class="px-8 py-6 space-y-5">
        <div x-show="gsmModal.loading" class="text-sm text-gray-400 py-8 text-center">加载中…</div>
        <template x-if="!gsmModal.loading && gsmModal.data">
          <div class="space-y-5">
            <table class="w-full text-sm border-collapse">
              <tbody class="divide-y divide-gray-100">
                <tr>
                  <td class="py-2 pr-6 text-gray-500 w-44 align-top">Status</td>
                  <td class="py-2 text-gray-900" x-text="'Public' + (gsmModal.data.release_date ? ' on ' + gsmModal.data.release_date : '')"></td>
                </tr>
                <tr>
                  <td class="py-2 pr-6 text-gray-500 align-top">Title</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.title || '—'"></td>
                </tr>
                <tr x-show="gsmModal.data.sample_type">
                  <td class="py-2 pr-6 text-gray-500 align-top">Sample type</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.sample_type"></td>
                </tr>
                <tr x-show="gsmModal.data.source_name">
                  <td class="py-2 pr-6 text-gray-500 align-top">Source name</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.source_name"></td>
                </tr>
                <tr x-show="gsmModal.data.organism">
                  <td class="py-2 pr-6 text-gray-500 align-top">Organism</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.organism"></td>
                </tr>
              </tbody>
            </table>
            <div x-show="gsmModal.data.characteristics && Object.keys(gsmModal.data.characteristics).length > 0">
              <table class="w-full text-sm border-collapse">
                <tbody class="divide-y divide-gray-100">
                  <template x-for="[k, v] in Object.entries(gsmModal.data.characteristics || {})" :key="k">
                    <tr>
                      <td class="py-2 pr-6 text-gray-500 w-44 align-top">Characteristics</td>
                      <td class="py-2 text-gray-900" x-text="k + ': ' + v"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <table class="w-full text-sm border-collapse">
              <tbody class="divide-y divide-gray-100">
                <tr x-show="gsmModal.data.treatment_protocol">
                  <td class="py-2 pr-6 text-gray-500 w-44 align-top">Treatment protocol</td>
                  <td class="py-2 text-gray-700 leading-relaxed" x-text="gsmModal.data.treatment_protocol"></td>
                </tr>
                <tr x-show="gsmModal.data.growth_protocol">
                  <td class="py-2 pr-6 text-gray-500 align-top">Growth protocol</td>
                  <td class="py-2 text-gray-700 leading-relaxed" x-text="gsmModal.data.growth_protocol"></td>
                </tr>
                <tr x-show="gsmModal.data.molecule">
                  <td class="py-2 pr-6 text-gray-500 align-top">Extracted molecule</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.molecule"></td>
                </tr>
                <tr x-show="gsmModal.data.extraction_protocol">
                  <td class="py-2 pr-6 text-gray-500 align-top">Extraction protocol</td>
                  <td class="py-2 text-gray-700 leading-relaxed" x-text="gsmModal.data.extraction_protocol"></td>
                </tr>
                <tr x-show="gsmModal.data.library_strategy">
                  <td class="py-2 pr-6 text-gray-500 align-top">Library strategy</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.library_strategy"></td>
                </tr>
                <tr x-show="gsmModal.data.library_source">
                  <td class="py-2 pr-6 text-gray-500 align-top">Library source</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.library_source"></td>
                </tr>
                <tr x-show="gsmModal.data.library_selection">
                  <td class="py-2 pr-6 text-gray-500 align-top">Library selection</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.library_selection"></td>
                </tr>
                <tr x-show="gsmModal.data.instrument_model">
                  <td class="py-2 pr-6 text-gray-500 align-top">Instrument model</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.instrument_model"></td>
                </tr>
                <tr x-show="gsmModal.data.description">
                  <td class="py-2 pr-6 text-gray-500 align-top">Description</td>
                  <td class="py-2 text-gray-700" x-text="gsmModal.data.description"></td>
                </tr>
                <tr x-show="gsmModal.data.data_processing">
                  <td class="py-2 pr-6 text-gray-500 align-top">Data processing</td>
                  <td class="py-2 text-gray-700 leading-relaxed" x-text="gsmModal.data.data_processing"></td>
                </tr>
                <tr>
                  <td class="py-2 pr-6 text-gray-500">Submission date</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.submission_date || '—'"></td>
                </tr>
                <tr>
                  <td class="py-2 pr-6 text-gray-500">Last update date</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.last_update_date || '—'"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.name">
                  <td class="py-2 pr-6 text-gray-500">Contact name</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.name"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.email">
                  <td class="py-2 pr-6 text-gray-500">E-mail(s)</td>
                  <td class="py-2"><a :href="'mailto:' + gsmModal.data.contact?.email" class="text-blue-600 hover:underline" x-text="gsmModal.data.contact?.email"></a></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.organization">
                  <td class="py-2 pr-6 text-gray-500">Organization name</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.organization"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.department">
                  <td class="py-2 pr-6 text-gray-500">Department</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.department"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.address">
                  <td class="py-2 pr-6 text-gray-500">Street address</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.address"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.city">
                  <td class="py-2 pr-6 text-gray-500">City</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.city"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.state">
                  <td class="py-2 pr-6 text-gray-500">State/province</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.state"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.zip">
                  <td class="py-2 pr-6 text-gray-500">ZIP/Postal code</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.zip"></td>
                </tr>
                <tr x-show="gsmModal.data.contact?.country">
                  <td class="py-2 pr-6 text-gray-500">Country</td>
                  <td class="py-2 text-gray-900" x-text="gsmModal.data.contact?.country"></td>
                </tr>
                <tr x-show="gsmModal.data.platform_id">
                  <td class="py-2 pr-6 text-gray-500">Platform ID</td>
                  <td class="py-2">
                    <a :href="'https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=' + gsmModal.data.platform_id"
                       target="_blank" class="text-blue-600 hover:underline font-mono text-sm"
                       x-text="gsmModal.data.platform_id"></a>
                  </td>
                </tr>
                <tr x-show="gsmModal.data.parent_gse">
                  <td class="py-2 pr-6 text-gray-500">Series</td>
                  <td class="py-2">
                    <a :href="'https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=' + gsmModal.data.parent_gse"
                       target="_blank" class="text-blue-600 hover:underline font-mono text-sm"
                       x-text="gsmModal.data.parent_gse + (gsmModal.data.parent_gse_title ? ' ' + gsmModal.data.parent_gse_title : '')"></a>
                  </td>
                </tr>
              </tbody>
            </table>
            <div x-show="gsmModal.data.biosample_id || gsmModal.data.sra_id" class="border-t pt-4">
              <p class="text-sm font-semibold text-gray-700 mb-2">Relations</p>
              <table class="w-full text-sm border-collapse">
                <tbody class="divide-y divide-gray-100">
                  <tr x-show="gsmModal.data.biosample_id">
                    <td class="py-2 pr-6 text-gray-500 w-44">BioSample</td>
                    <td class="py-2">
                      <a :href="'https://www.ncbi.nlm.nih.gov/biosample/' + gsmModal.data.biosample_id"
                         target="_blank" class="text-blue-600 hover:underline" x-text="gsmModal.data.biosample_id"></a>
                    </td>
                  </tr>
                  <tr x-show="gsmModal.data.sra_id">
                    <td class="py-2 pr-6 text-gray-500">SRA</td>
                    <td class="py-2">
                      <a :href="gsmModal.data.sra_link" target="_blank" class="text-blue-600 hover:underline" x-text="gsmModal.data.sra_id"></a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div x-show="gsmModal.data.supplementary_files?.length > 0" class="border-t pt-4">
              <p class="text-sm font-semibold text-gray-700 mb-3">Supplementary file</p>
              <table class="w-full text-xs border rounded-lg overflow-hidden">
                <thead class="bg-gray-50 border-b">
                  <tr>
                    <th class="text-left px-3 py-2 font-medium text-gray-600">文件</th>
                    <th class="text-left px-3 py-2 font-medium text-gray-600">类型</th>
                  </tr>
                </thead>
                <tbody class="divide-y bg-white">
                  <template x-for="f in gsmModal.data.supplementary_files" :key="f.url">
                    <tr>
                      <td class="px-3 py-2">
                        <a :href="f.url" target="_blank" class="text-blue-600 hover:underline break-all" x-text="f.url.split('/').pop()"></a>
                      </td>
                      <td class="px-3 py-2 text-gray-500" x-text="f.type || '—'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <div x-show="annotationError" class="mb-4 text-red-600 text-sm bg-red-50 rounded-lg px-4 py-2" x-text="annotationError"></div>
  <div class="flex items-center gap-3 mb-6">
    <a href="/tasks-list" class="text-gray-400 hover:text-gray-600 text-sm">← Tasks</a>
    <h1 class="text-2xl font-bold" x-text="task.name || 'Loading…'"></h1>
    <span :class="statusClass(task.status)"
          class="text-xs font-semibold px-2 py-1 rounded-full" x-text="task.status"></span>
  </div>

  <div class="grid gap-3 md:grid-cols-6 mb-6">
    <div class="bg-white rounded-xl border border-gray-200 px-4 py-3">
      <p class="text-xs text-gray-400">GEO Candidates</p>
      <p class="text-2xl font-semibold" x-text="task.candidate_count || 0"></p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 px-4 py-3">
      <p class="text-xs text-gray-400">Included</p>
      <p class="text-2xl font-semibold text-green-700" x-text="task.included_count || 0"></p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 px-4 py-3">
      <p class="text-xs text-gray-400">Excluded</p>
      <p class="text-2xl font-semibold text-red-700" x-text="task.excluded_count || 0"></p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 px-4 py-3">
      <p class="text-xs text-gray-400">Uncertain</p>
      <p class="text-2xl font-semibold text-yellow-700" x-text="task.uncertain_count || 0"></p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 px-4 py-3 flex items-center">
      <button @click="triggerAnnotation()" :disabled="annotating"
              class="w-full text-sm bg-blue-600 text-white rounded-lg py-1.5 hover:bg-blue-700 disabled:opacity-50">
        <span x-text="annotating ? 'Running…' : 'Run GSE Annotation'"></span>
      </button>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 px-4 py-3 flex items-center">
      <button @click="runAllGsmAnnotation()" :disabled="gsmAnnotating"
              class="w-full text-sm bg-teal-600 text-white rounded-lg py-1.5 hover:bg-teal-700 disabled:opacity-50">
        <span x-text="gsmAnnotating ? 'GSM 标注中…' : 'Run GSM Annotation'"></span>
      </button>
    </div>
  </div>

  <div x-show="task.status === 'running'" class="mb-6">
    <div class="flex justify-between text-xs text-gray-400 mb-1">
      <span x-text="task.processed + ' / ' + task.total + ' processed'"></span>
      <span x-text="task.total ? Math.round(task.processed/task.total*100) + '%' : '0%'"></span>
    </div>
    <div class="w-full bg-gray-100 rounded-full h-2">
      <div class="bg-blue-500 h-2 rounded-full transition-all"
           :style="'width:' + (task.total ? Math.round(task.processed/task.total*100) : 0) + '%'"></div>
    </div>
  </div>

  <div class="flex justify-between items-center mb-4 gap-3">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <label class="text-sm text-gray-500">筛选</label>
        <select x-model="decisionFilter" @change="reloadResults()"
                class="border rounded-lg px-3 py-2 text-sm bg-white">
          <option value="">全部候选</option>
          <option value="include">Included</option>
          <option value="exclude">Excluded</option>
          <option value="uncertain">Uncertain</option>
        </select>
      </div>
      <input type="text" x-model="accessionSearch"
             @input.debounce.300ms="reloadResults()"
             placeholder="搜索 GSE…"
             class="border rounded-lg px-3 py-2 text-sm bg-white w-36 focus:outline-none focus:ring-2 focus:ring-blue-300" />
    </div>
    <div class="flex items-center gap-2">
      <a :href="'/tasks/' + taskId + '/export'"
         class="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg font-medium">导出 CSV</a>
      <button @click="fetchPapers()" :disabled="fetchingPdfs"
              class="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg font-medium disabled:opacity-50"
              x-text="fetchingPdfs ? '下载中…' : '下载文章 PDF'"></button>
      <button @click="runPaperCalibration()" :disabled="calibrating"
              class="text-sm bg-blue-50 hover:bg-blue-100 text-blue-700 px-4 py-2 rounded-lg font-medium disabled:opacity-50"
              x-text="calibrating ? '校准中…' : '用文章重新校准'"></button>
      <div class="relative" x-data="{libOpen:false}">
        <button @click="libOpen=!libOpen"
                class="border border-gray-300 text-gray-700 rounded-lg px-4 py-2 text-sm font-medium hover:bg-gray-50 flex items-center gap-1">
          存入文献库 <span x-text="libOpen ? '▲' : '▼'" class="text-xs"></span>
        </button>
        <div x-show="libOpen" @click.outside="libOpen=false"
             class="absolute right-0 mt-1 bg-white border rounded-xl shadow-lg z-10 w-52 py-1">
          <template x-for="lib in libs" :key="lib.id">
            <button @click="saveToLib(lib.id); libOpen=false"
                    class="w-full text-left px-4 py-2 text-sm hover:bg-gray-50 truncate"
                    x-text="lib.name"></button>
          </template>
          <div x-show="libs.length===0" class="px-4 py-2 text-xs text-gray-400">暂无文献库</div>
          <div class="border-t mt-1 pt-1">
            <a href="/library" class="block px-4 py-2 text-xs text-blue-600 hover:bg-gray-50">管理文献库 →</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-gray-200 overflow-x-auto">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 border-b">
        <tr>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-36">Accession</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600">标题</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-20">Samples</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-48">实验类型</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-28">论文更新日期</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-28">最后更新</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-16">原始数据</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-16">PDF</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-24">原始决策</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-24">决策</th>
          <th class="text-left px-4 py-3 font-medium text-gray-600 w-16">操作</th>
        </tr>
      </thead>
      <template x-for="r in results" :key="r.id">
        <tbody class="divide-y" id="results-tbody">
          <tr @click="toggleExpand(r.id)" class="cursor-pointer hover:bg-gray-50">
            <td class="px-4 py-3">
              <p class="font-mono text-xs font-semibold text-blue-700" x-text="r.dataset_id"></p>
            </td>
            <td class="px-4 py-3 text-xs text-gray-800">
              <p class="line-clamp-2 font-medium text-gray-900" x-text="r.title || '无标题数据集'"></p>
              <p class="mt-1 text-[11px] text-gray-500" x-text="(r.labels && r.labels.length) ? ('已标注 ' + r.labels.length + ' 项') : '未生成标注'"></p>
            </td>
            <td class="px-4 py-3 text-xs text-center" x-text="r.n_samples || '—'"></td>
            <td class="px-4 py-3 text-xs text-gray-500 max-w-xs truncate" x-text="r.gse_type || '—'"></td>
            <td class="px-4 py-3 text-xs text-gray-500" x-text="r.pubdate || '—'"></td>
            <td class="px-4 py-3 text-xs text-gray-500" x-text="r.update_date || '—'"></td>
            <td class="px-4 py-3 text-center">
              <span x-show="r.has_raw_data" class="text-green-500">✓</span>
              <span x-show="!r.has_raw_data" class="text-gray-300">—</span>
            </td>
            <td class="px-4 py-3 text-center text-sm">
              <span x-show="!r.pdf_status || r.pdf_status === 'none'" class="text-gray-300">—</span>
              <span x-show="r.pdf_status === 'fetching'" class="text-blue-400">⟳</span>
              <a x-show="r.pdf_status === 'available'" :href="'/pdfs/' + r.dataset_id + '.pdf'" target="_blank" class="text-blue-600">📄</a>
              <span x-show="r.pdf_status === 'failed'" class="text-red-400">✗</span>
            </td>
            <td class="px-4 py-3">
              <span x-show="r.original_decision"
                    class="text-xs font-semibold px-2 py-0.5 rounded-full bg-gray-100 text-gray-500"
                    x-text="({include:'Included',exclude:'Excluded',uncertain:'Uncertain'})[r.original_decision] || r.original_decision"></span>
            </td>
            <td class="px-4 py-3" @click.stop>
              <span x-show="!r.editingDecision"
                    :class="decisionClass(r.decision)"
                    class="text-xs font-semibold px-2 py-0.5 rounded-full cursor-pointer"
                    @click="r.editingDecision = true"
                    x-text="({include:'Included',exclude:'Excluded',uncertain:'Uncertain'})[r.decision] || '—'"></span>
              <select x-show="r.editingDecision"
                      class="text-xs border rounded px-1 py-0.5"
                      :value="r.decision"
                      @change="updateDecision(r, $event.target.value)"
                      @blur="r.editingDecision = false">
                <option value="include">Included</option>
                <option value="exclude">Excluded</option>
                <option value="uncertain">Uncertain</option>
              </select>
            </td>
            <td class="px-4 py-3 text-xs text-blue-600" x-text="expanded.has(r.id) ? '收起' : '展开'"></td>
          </tr>
          <tr x-show="expanded.has(r.id)" class="bg-slate-50">
            <td colspan="11" class="px-4 py-4">
              <div class="mb-4" x-data="labelEditor(r)">
                <div class="flex items-center justify-between mb-2">
                  <p class="text-xs font-semibold text-gray-500">标注</p>
                  <button @click="runGseAnnotation(r.id)"
                          class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1 rounded-lg border border-indigo-200">
                    重新标注此 GSE
                  </button>
                </div>
                <div class="flex flex-wrap gap-2">
                  <template x-for="lbl in labels" :key="lbl.key">
                    <div class="flex items-center gap-1 bg-white border rounded-lg px-2 py-1 text-xs">
                      <span class="text-gray-500" x-text="lbl.key + ':'"></span>
                      <span x-show="!lbl.editing"
                            :class="lbl.source==='human' ? 'text-blue-700 font-medium' : 'text-gray-700'"
                            x-text="lbl.value || '—'"></span>
                      <input x-show="lbl.editing" x-model="lbl.editVal"
                             @keydown.enter="saveLabel(lbl)" @keydown.escape="lbl.editing=false"
                             class="border-b border-blue-400 outline-none text-xs w-24 px-1" />
                      <button @click="lbl.editing ? saveLabel(lbl) : startEdit(lbl)"
                              class="text-gray-400 hover:text-blue-600 ml-1"
                              x-text="lbl.editing ? '✓' : '✎'"></button>
                    </div>
                  </template>
                  <span x-show="labels.length === 0" class="text-xs text-gray-400">暂无标注，点击 Run LLM Annotation 自动提取</span>
                </div>
              </div>
              <div x-show="r.samples && r.samples.length > 0">
                <div class="flex items-center justify-between mb-2">
                  <p class="text-xs font-semibold text-gray-500">样本列表 (GSM)</p>
                  <button x-show="r.decision === 'include' || r.decision === 'uncertain' || !r.decision"
                          @click="runGsmAnnotation(r.id)"
                          class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1 rounded-lg border border-blue-200">
                    标注 GSM
                  </button>
                </div>
                <table class="w-full text-xs border rounded-lg overflow-hidden">
                  <thead class="bg-gray-100">
                    <tr>
                      <th class="text-left px-3 py-2 font-medium text-gray-600">样本名称</th>
                      <th class="text-left px-3 py-2 font-medium text-gray-600">标题</th>
                      <th class="text-left px-3 py-2 font-medium text-gray-600">生物体</th>
                      <th class="text-left px-3 py-2 font-medium text-gray-600">生物样本关系ID</th>
                      <th class="text-left px-3 py-2 font-medium text-gray-600">cellCount</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y bg-white">
                    <template x-for="s in r.samples" :key="s.gsm_id">
                      <tr @click="toggleGsm(s.gsm_id)" class="cursor-pointer hover:bg-gray-50">
                        <td class="px-3 py-2 font-mono text-blue-700 hover:underline"
                            @click.stop="openGsmModal(s.gsm_id)" x-text="s.gsm_id"></td>
                        <td class="px-3 py-2 text-gray-700" x-text="s.title || '—'"></td>
                        <td class="px-3 py-2 text-gray-500" x-text="s.organism || '—'"></td>
                        <td class="px-3 py-2 text-blue-600" x-text="s.biosample_id || '—'"></td>
                        <td class="px-3 py-2 text-gray-700" x-text="s.cell_count || '—'"></td>
                      </tr>
                      <tr x-show="expandedGsm.has(s.gsm_id)" x-data="gsmLabelEditor(s)" x-init="init()">
                        <td colspan="5" class="px-3 py-2 bg-slate-50">
                          <div class="flex flex-wrap gap-1">
                            <template x-for="lbl in gsmLabels" :key="lbl.key">
                              <span :class="lbl.key === 'gsm_available' ? gsmAvailClass(lbl.value) : 'bg-gray-100 text-gray-700'"
                                    class="text-xs px-2 py-0.5 rounded-full font-medium"
                                    x-text="lbl.key + ': ' + (lbl.value || '—')"></span>
                            </template>
                            <span x-show="gsmLabels.length === 0" class="text-xs text-gray-400">暂无标注</span>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <div x-show="r.summary" class="mt-3">
                <p class="text-xs font-semibold text-gray-500 mb-1">筛选摘要</p>
                <p class="text-xs text-gray-600" x-text="r.summary"></p>
              </div>
            </td>
          </tr>
        </tbody>
      </template>
    </table>
    <div x-show="results.length === 0 && !loading" class="text-center text-gray-400 py-8 text-sm">暂无结果</div>
  </div>

  <div class="flex flex-wrap justify-between items-center mt-4 gap-3 text-sm">
    <button @click="prevPage()" :disabled="page <= 1"
            class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 disabled:opacity-40">← Prev</button>
    <div class="flex flex-wrap items-center justify-center gap-2">
      <span class="text-gray-400">
        第 <span x-text="page"></span> 页，共 <span x-text="totalPages"></span> 页
      </span>
      <template x-for="item in visiblePaginationItems" :key="item.key">
        <template x-if="item.type === 'page'">
          <button @click="goToPage(item.value)"
                  :class="item.value === page ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
                  class="min-w-9 px-3 py-1.5 rounded-lg text-sm font-medium"
                  x-text="item.value"></button>
        </template>
        <template x-if="item.type === 'ellipsis'">
          <span class="px-1 text-sm text-gray-400">…</span>
        </template>
      </template>
      <div class="flex items-center gap-2 ml-2">
        <label class="text-sm text-gray-500">跳至页码</label>
        <input x-model.number="jumpPageInput" type="number" min="1" :max="totalPages"
               class="w-20 border rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <button @click="jumpToPage()"
                class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-sm">Go</button>
      </div>
    </div>
    <button @click="nextPage()" :disabled="page >= totalPages"
            class="px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 disabled:opacity-40">Next →</button>
  </div>
</div>

<script>
  function taskDetailPage(taskId) {
    return {
      taskId, task: {}, results: [], loading: true,
      page: 1, pageSize: 20, total: 0, jumpPageInput: 1, expanded: new Set(),
      decisionFilter: '', accessionSearch: '', annotating: false, annotationError: '', gsmAnnotating: false,
      fetchingPdfs: false, calibrating: false,
      pollTimer: null, libs: [],
      expandedGsm: new Set(),
      gsmModal: {open: false, id: '', loading: false, data: null},

      async openGsmModal(gsm_id) {
        this.gsmModal = {open: true, id: gsm_id, loading: true, data: null};
        const r = await fetch(`/geo/gsm/${gsm_id}/detail`).catch(() => null);
        if (r && r.ok) this.gsmModal.data = await r.json();
        this.gsmModal.loading = false;
      },

      async init() {
        await this.loadTask();
        await this.loadLibs();
        await this.loadResults();
        if (this.task.status === 'running' || this.task.status === 'pending') {
          this.pollTimer = setInterval(() => this.poll(), 3000);
        }
      },
      async loadTask() {
        const r = await fetch('/tasks/' + this.taskId);
        if (r.ok) this.task = await r.json();
      },
      async loadResults() {
        this.loading = true;
        const params = new URLSearchParams({page: this.page, page_size: this.pageSize});
        if (this.decisionFilter) params.set('decision', this.decisionFilter);
        if (this.accessionSearch) params.set('accession', this.accessionSearch);
        const r = await fetch('/tasks/' + this.taskId + '/results?' + params.toString());
        if (r.ok) {
          const d = await r.json();
          this.results = d.items.map(item => ({...item, editingDecision: false}));
          this.total = d.total;
          this.jumpPageInput = this.page;
        }
        this.loading = false;
      },
      async reloadResults() { this.page = 1; await this.loadResults(); },
      async poll() {
        await this.loadTask();
        await this.loadResults();
        if (this.task.status !== 'running' && this.task.status !== 'pending') clearInterval(this.pollTimer);
      },
      async triggerAnnotation() {
        this.annotating = true;
        this.annotationError = '';
        try {
          const response = await fetch('/annotate/tasks/' + this.taskId + '/run', {method: 'POST'});
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.detail || 'Run LLM Annotation failed');
          }
          let polls = 0;
          const annotationPoll = setInterval(async () => {
            await this.loadResults();
            polls++;
            if (polls >= 20) clearInterval(annotationPoll);
          }, 3000);
        } catch (error) {
          this.annotationError = error.message;
        } finally {
          this.annotating = false;
        }
      },
      async loadLibs() {
        const r = await fetch('/library');
        if (r.ok) this.libs = await r.json();
      },
      get totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },
      get visiblePaginationItems() { return buildPaginationItems(this.page, this.totalPages); },
      async goToPage(nextPage) {
        if (nextPage < 1 || nextPage > this.totalPages || nextPage === this.page) return;
        this.page = nextPage;
        await this.loadResults();
      },
      async prevPage() { if (this.page > 1) { await this.goToPage(this.page - 1); } },
      async nextPage() { if (this.page < this.totalPages) { await this.goToPage(this.page + 1); } },
      async jumpToPage() {
        const target = Number(this.jumpPageInput);
        if (!Number.isInteger(target) || target < 1 || target > this.totalPages) return;
        await this.goToPage(target);
      },
      async saveToLib(libId) {
        const entries = this.results
          .filter(r => r.decision === 'include' || !r.decision)
          .map(r => ({
            gse_id: r.dataset_id, title: r.title, organism: '',
            n_samples: r.n_samples || 0, gse_type: r.gse_type || '',
            has_raw_data: r.has_raw_data || false, summary: r.summary || '',
            pubdate: r.pubdate || '', update_date: r.update_date || '',
          }));
        const r = await fetch('/library/' + libId + '/entries', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({entries, source: 'task', task_id: this.taskId}),
        });
        if (r.ok) {
          const data = await r.json();
          alert(`已存入 ${data.added} 条（跳过重复 ${data.skipped} 条）`);
        }
      },
      toggleExpand(id) {
        if (this.expanded.has(id)) this.expanded.delete(id); else this.expanded.add(id);
        this.expanded = new Set(this.expanded);
      },
      toggleGsm(gsmId) {
        if (this.expandedGsm.has(gsmId)) this.expandedGsm.delete(gsmId);
        else this.expandedGsm.add(gsmId);
        this.expandedGsm = new Set(this.expandedGsm);
      },
      async runGsmAnnotation(resultId) {
        // Fetch and store GSM samples first if not yet loaded
        await fetch('/tasks/' + this.taskId + '/results/' + resultId + '/fetch-samples', {method: 'POST'});
        const r = await fetch('/annotate/results/' + resultId + '/gsm-labels/run', {method: 'POST'});
        if (r.ok) {
          await this.loadResults();
        }
      },
      async runGseAnnotation(resultId) {
        const r = await fetch('/annotate/results/' + resultId + '/run', {method: 'POST'});
        if (r.ok) {
          await this.loadResults();
        }
      },
      async runAllGsmAnnotation() {
        this.gsmAnnotating = true;
        try {
          const r = await fetch('/tasks/' + this.taskId + '/run-gsm-annotation', {method: 'POST'});
          if (r.ok) {
            const data = await r.json();
            if (data.gsm_task_id) {
              window.location.href = '/tasks/' + data.gsm_task_id + '/detail';
            }
          }
        } finally {
          this.gsmAnnotating = false;
        }
      },
      async fetchPapers() {
        this.fetchingPdfs = true;
        try {
          await fetch('/tasks/' + this.taskId + '/fetch-papers', {method: 'POST'});
          const pollPdf = setInterval(async () => { await this.loadResults(); }, 3000);
          setTimeout(() => clearInterval(pollPdf), 120000);
        } finally {
          this.fetchingPdfs = false;
        }
      },
      async runPaperCalibration() {
        this.calibrating = true;
        try {
          await fetch('/tasks/' + this.taskId + '/run-paper-calibration', {method: 'POST'});
          const pollCal = setInterval(async () => { await this.loadResults(); }, 3000);
          setTimeout(() => clearInterval(pollCal), 300000);
        } finally {
          this.calibrating = false;
        }
      },
      statusClass(s) {
        return {pending:'bg-gray-100 text-gray-600', running:'bg-blue-100 text-blue-700',
                done:'bg-green-100 text-green-700', error:'bg-red-100 text-red-700'}[s] || 'bg-gray-100 text-gray-600';
      },
      decisionClass(d) {
        return {include:'bg-green-100 text-green-700', exclude:'bg-red-100 text-red-700',
                uncertain:'bg-yellow-100 text-yellow-700'}[d] || 'bg-gray-100 text-gray-500';
      },
      async updateDecision(r, newVal) {
        const oldVal = r.decision;
        r.decision = newVal;
        r.editingDecision = false;
        const resp = await fetch('/tasks/' + this.taskId + '/results/' + r.id, {
          method: 'PATCH',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({decision: newVal}),
        });
        if (resp.ok) {
          const data = await resp.json();
          this.task.included_count = data.included_count;
          this.task.excluded_count = data.excluded_count;
          this.task.uncertain_count = data.uncertain_count;
        } else {
          r.decision = oldVal;
        }
      },
    }
  }

  function labelEditor(result) {
    return {
      resultId: result.id,
      labels: (result.labels || []).map(l => ({...l, editing: false, editVal: l.value})),
      startEdit(lbl) { lbl.editVal = lbl.value; lbl.editing = true; },
      async saveLabel(lbl) {
        const r = await fetch('/annotate/results/' + this.resultId + '/labels', {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({key: lbl.key, value: lbl.editVal}),
        });
        if (r.ok) {
          const updated = await r.json();
          lbl.value = updated.value;
          lbl.source = updated.source;
          lbl.editing = false;
        }
      }
    }
  }

  function gsmLabelEditor(sample) {
    return {
      sampleId: sample.id,
      gsmLabels: [],
      async init() {
        const r = await fetch('/annotate/samples/' + this.sampleId + '/labels');
        if (r.ok) this.gsmLabels = await r.json();
      },
      gsmAvailClass(v) {
        return {
          '可用': 'bg-green-100 text-green-700',
          '不可用': 'bg-red-100 text-red-700',
          '待确认': 'bg-yellow-100 text-yellow-700',
        }[v] || 'bg-gray-100 text-gray-700';
      }
    }
  }

  async function createGsmTask() {
    const btn = document.getElementById('create-gsm-btn');
    btn.disabled = true;
    btn.textContent = '创建中...';
    try {
      const resp = await fetch(`/tasks/{{ task_id }}/create-gsm-task`, {method: 'POST'});
      if (resp.ok) {
        const data = await resp.json();
        window.location.href = `/tasks/${data.id}/detail`;
      } else {
        alert('创建失败');
        btn.disabled = false;
        btn.textContent = '创建 GSM 注释任务';
      }
    } catch(e) {
      alert('创建失败: ' + e);
      btn.disabled = false;
      btn.textContent = '创建 GSM 注释任务';
    }
  }

  function buildPaginationItems(currentPage, totalPages) {
    if (totalPages <= 7) {
      return Array.from({length: totalPages}, (_, i) => ({
        key: `page-${i + 1}`,
        type: 'page',
        value: i + 1,
      }));
    }

    const pages = new Set([1, totalPages, currentPage - 1, currentPage, currentPage + 1]);

    if (currentPage <= 3) {
      pages.add(2);
      pages.add(3);
    }

    if (currentPage >= totalPages - 2) {
      pages.add(totalPages - 1);
      pages.add(totalPages - 2);
    }

    const sortedPages = Array.from(pages)
      .filter((page) => page >= 1 && page <= totalPages)
      .sort((a, b) => a - b);

    const items = [];
    for (let index = 0; index < sortedPages.length; index++) {
      const value = sortedPages[index];
      if (index > 0 && value - sortedPages[index - 1] > 1) {
        items.push({key: `ellipsis-${sortedPages[index - 1]}-${value}`, type: 'ellipsis'});
      }
      items.push({key: `page-${value}`, type: 'page', value});
    }
    return items;
  }
</script>
{% endblock %}
