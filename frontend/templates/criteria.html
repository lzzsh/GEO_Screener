{% extends "base.html" %}
{% block title %}Criteria — GEO Screener{% endblock %}
{% block content %}
<div x-data="criteriaPage()" x-init="load(); init()">
  <h1 class="text-2xl font-bold mb-6">Screening Criteria & Annotation Schemas</h1>

  <!-- Tab navigation -->
  <div class="flex gap-4 mb-6 border-b border-gray-200">
    <button @click="activeTab = 'criteria'"
            :class="activeTab === 'criteria' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'"
            class="px-4 py-2 font-medium text-sm transition">
      Criteria Templates
    </button>
    <button @click="activeTab = 'schemas'"
            :class="activeTab === 'schemas' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'"
            class="px-4 py-2 font-medium text-sm transition">
      Annotation Schemas
    </button>
  </div>

  <!-- Criteria Tab -->
  <div x-show="activeTab === 'criteria'" class="flex gap-6">
    <!-- Left panel: list -->
    <div class="w-64 flex-shrink-0">
      <button @click="newCriteria()"
              class="w-full mb-3 bg-blue-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-blue-700">
        + New Criteria
      </button>
      <div class="space-y-1">
        <template x-for="c in list" :key="c.id">
          <button @click="select(c)"
                  :class="selected && selected.id === c.id ? 'bg-blue-50 border-blue-300' : 'bg-white border-gray-200'"
                  class="w-full text-left px-3 py-2.5 rounded-lg border text-sm hover:border-blue-300 transition">
            <p class="font-medium truncate" x-text="c.name"></p>
            <p class="text-xs text-gray-400 mt-0.5" x-text="new Date(c.updated_at).toLocaleDateString()"></p>
          </button>
        </template>
      </div>
    </div>

    <!-- Right panel: editor -->
    <div class="flex-1 bg-white rounded-xl border border-gray-200 p-6">
      <div x-show="!selected" class="text-gray-400 text-sm text-center py-16">
        Select a criteria template or create a new one.
      </div>
      <div x-show="selected">
        <div x-show="saveMsg" class="mb-3 text-green-600 text-sm" x-text="saveMsg"></div>
        <div x-show="error" class="mb-3 text-red-600 text-sm" x-text="error"></div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Name</label>
          <input x-model="editName" type="text"
                 class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Criteria Text</label>
          <textarea x-model="editText" rows="12"
                    placeholder="Describe your inclusion/exclusion criteria in natural language…"
                    class="w-full border rounded-lg px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
        </div>
        <div class="flex gap-3">
          <button @click="save()" :disabled="saving"
                  class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
            <span x-text="saving ? 'Saving…' : 'Save'"></span>
          </button>
          <button @click="deleteCriteria()" x-show="selected && selected.id"
                  class="text-red-500 hover:text-red-700 px-4 py-2 text-sm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Annotation Schemas Tab -->
  <div x-show="activeTab === 'schemas'" class="flex gap-6">
    <!-- Left panel: schema list -->
    <div class="w-64 flex-shrink-0">
      <button @click="newSchema()"
              class="w-full mb-2 bg-blue-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-blue-700">
        + New Schema
      </button>
      <button @click="loadDefaultTemplate()"
              class="w-full mb-3 bg-gray-100 text-gray-700 rounded-lg py-2 text-sm font-medium hover:bg-gray-200">
        📋 Use Default Template
      </button>
      <div class="space-y-1">
        <template x-for="s in schemaList" :key="s.id">
          <button @click="selectSchema(s)"
                  :class="selectedSchema && selectedSchema.id === s.id ? 'bg-blue-50 border-blue-300' : 'bg-white border-gray-200'"
                  class="w-full text-left px-3 py-2.5 rounded-lg border text-sm hover:border-blue-300 transition">
            <p class="font-medium truncate" x-text="s.name"></p>
            <p class="text-xs text-gray-400 mt-0.5" x-text="new Date(s.updated_at).toLocaleDateString()"></p>
          </button>
        </template>
      </div>
    </div>

    <!-- Right panel: schema editor -->
    <div class="flex-1 bg-white rounded-xl border border-gray-200 p-6">
      <div x-show="!selectedSchema" class="text-gray-400 text-sm text-center py-16">
        Select a schema or create a new one.
      </div>
      <div x-show="selectedSchema">
        <div x-show="schemaSaveMsg" class="mb-3 text-green-600 text-sm" x-text="schemaSaveMsg"></div>
        <div x-show="schemaError" class="mb-3 text-red-600 text-sm" x-text="schemaError"></div>

        <!-- Schema tabs -->
        <div class="flex gap-2 mb-4 border-b border-gray-200">
          <button @click="schemaTab = 'labels'"
                  :class="schemaTab === 'labels' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'"
                  class="px-3 py-2 font-medium text-sm transition">
            Labels
          </button>
          <button @click="schemaTab = 'prompts'" x-show="selectedSchema && selectedSchema.id"
                  :class="schemaTab === 'prompts' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-gray-600'"
                  class="px-3 py-2 font-medium text-sm transition">
            Prompts
          </button>
        </div>

        <!-- Labels Tab -->
        <div x-show="schemaTab === 'labels'">
          <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Name</label>
            <input x-model="schemaEditName" type="text"
                   class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>

          <div class="mb-4">
            <label class="block text-sm font-medium mb-1">Description</label>
            <input x-model="schemaEditDesc" type="text"
                   class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>

          <!-- GSE Labels -->
          <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-sm font-semibold">GSE Labels</h3>
              <button @click="addGseLabel()" class="text-xs text-blue-600 hover:text-blue-700">+ Add Label</button>
            </div>
            <div class="space-y-2 max-h-64 overflow-y-auto border rounded-lg p-3 bg-gray-50">
              <template x-for="(label, idx) in schemaEditGseLabels" :key="idx">
                <div class="bg-white p-3 rounded border border-gray-200 text-sm">
                  <div class="flex justify-between items-start mb-2">
                    <div class="flex-1">
                      <p class="font-medium" x-text="label.name"></p>
                      <p class="text-xs text-gray-600" x-text="label.description"></p>
                      <p class="text-xs text-gray-500 mt-1">Type: <span x-text="label.type"></span></p>
                    </div>
                    <button @click="removeGseLabel(idx)" class="text-red-500 hover:text-red-700 text-xs">✕</button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- GSM Labels -->
          <div class="mb-6">
            <div class="flex justify-between items-center mb-3">
              <h3 class="text-sm font-semibold">GSM Labels</h3>
              <button @click="addGsmLabel()" class="text-xs text-blue-600 hover:text-blue-700">+ Add Label</button>
            </div>
            <div class="space-y-2 max-h-64 overflow-y-auto border rounded-lg p-3 bg-gray-50">
              <template x-for="(label, idx) in schemaEditGsmLabels" :key="idx">
                <div class="bg-white p-3 rounded border border-gray-200 text-sm">
                  <div class="flex justify-between items-start mb-2">
                    <div class="flex-1">
                      <p class="font-medium" x-text="label.name"></p>
                      <p class="text-xs text-gray-600" x-text="label.description"></p>
                      <p class="text-xs text-gray-500 mt-1">Type: <span x-text="label.type"></span></p>
                    </div>
                    <button @click="removeGsmLabel(idx)" class="text-red-500 hover:text-red-700 text-xs">✕</button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>

        <!-- Prompts Tab -->
        <div x-show="schemaTab === 'prompts'">
          <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Select Prompt Type</label>
            <select x-model="selectedPromptType" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
              <option value="label_prompt">GSE Label Prompt</option>
              <option value="gsm_label_prompt">GSM Label Prompt</option>
              <option value="screening_prompt">Screening Prompt</option>
              <option value="paper_calibration_prompt">Paper Calibration Prompt</option>
            </select>
          </div>

          <div x-show="promptLoading" class="text-gray-500 text-sm">Loading prompt...</div>
          <div x-show="!promptLoading">
            <textarea x-model="promptContent" rows="16"
                      class="w-full border rounded-lg px-3 py-2 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
            <div class="flex gap-3 mt-3">
              <button @click="savePrompt()" :disabled="promptSaving"
                      class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
                <span x-text="promptSaving ? 'Saving…' : 'Save Prompt'"></span>
              </button>
            </div>
          </div>
        </div>

        <div class="flex gap-3 mt-6" x-show="schemaTab === 'labels'">
          <button @click="saveSchema()" :disabled="schemaSaving"
                  class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
            <span x-text="schemaSaving ? 'Saving…' : 'Save'"></span>
          </button>
          <button @click="deleteSchema()" x-show="selectedSchema && selectedSchema.id"
                  class="text-red-500 hover:text-red-700 px-4 py-2 text-sm">Delete</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function criteriaPage() {
    return {
      activeTab: 'criteria',
      list: [], selected: null, editName: '', editText: '',
      saving: false, saveMsg: '', error: '',
      schemaList: [], selectedSchema: null,
      schemaEditName: '', schemaEditDesc: '', schemaEditGseLabels: [], schemaEditGsmLabels: [],
      schemaSaving: false, schemaSaveMsg: '', schemaError: '',
      schemaTab: 'labels',
      selectedPromptType: 'label_prompt',
      promptContent: '',
      promptLoading: false,
      promptSaving: false,

      async load() {
        const r = await fetch('/criteria');
        if (r.status === 401) { window.location.href = '/login'; return; }
        this.list = await r.json();
        await this.loadSchemas();
      },
      async loadSchemas() {
        try {
          const r = await fetch('/annotation-schemas');
          if (r.ok) {
            this.schemaList = await r.json();
          }
        } catch (e) {
          console.error('Failed to load schemas:', e);
        }
      },
      select(c) {
        this.selected = c; this.editName = c.name; this.editText = c.criteria_text;
        this.saveMsg = ''; this.error = '';
      },
      selectSchema(s) {
        this.selectedSchema = s;
        this.schemaEditName = s.name;
        this.schemaEditDesc = s.description || '';
        this.schemaEditGseLabels = s.gse_labels || [];
        this.schemaEditGsmLabels = s.gsm_labels || [];
        this.schemaSaveMsg = ''; this.schemaError = '';
        this.schemaTab = 'labels';
        this.selectedPromptType = 'label_prompt';
        this.promptContent = '';
      },
      init() {
        this.$watch('schemaTab', () => {
          if (this.schemaTab === 'prompts' && this.selectedSchema && this.selectedSchema.id) {
            this.loadPrompt();
          }
        });
        this.$watch('selectedPromptType', () => {
          if (this.schemaTab === 'prompts' && this.selectedSchema && this.selectedSchema.id) {
            this.loadPrompt();
          }
        });
      },
      newCriteria() {
        this.selected = {id: null, name: '', criteria_text: ''};
        this.editName = ''; this.editText = ''; this.saveMsg = ''; this.error = '';
      },
      newSchema() {
        this.selectedSchema = {id: null, name: '', description: '', gse_labels: [], gsm_labels: []};
        this.schemaEditName = ''; this.schemaEditDesc = '';
        this.schemaEditGseLabels = []; this.schemaEditGsmLabels = [];
        this.schemaSaveMsg = ''; this.schemaError = '';
      },
      async loadDefaultTemplate() {
        try {
          const r = await fetch('/annotation-schemas/default-template');
          if (r.ok) {
            const template = await r.json();
            this.selectedSchema = {id: null, name: '', description: '', gse_labels: [], gsm_labels: []};
            this.schemaEditName = template.name;
            this.schemaEditDesc = template.description;
            this.schemaEditGseLabels = template.gse_labels;
            this.schemaEditGsmLabels = template.gsm_labels;
            this.schemaSaveMsg = ''; this.schemaError = '';
          }
        } catch (e) {
          console.error('Failed to load default template:', e);
        }
      },
      addGseLabel() {
        this.schemaEditGseLabels.push({name: '', description: '', type: 'free_text', allowed_values: []});
      },
      removeGseLabel(idx) {
        this.schemaEditGseLabels.splice(idx, 1);
      },
      addGsmLabel() {
        this.schemaEditGsmLabels.push({name: '', description: '', type: 'free_text', allowed_values: []});
      },
      removeGsmLabel(idx) {
        this.schemaEditGsmLabels.splice(idx, 1);
      },
      async save() {
        this.saving = true; this.error = ''; this.saveMsg = '';
        try {
          const body = {name: this.editName, criteria_text: this.editText};
          let r;
          if (this.selected.id) {
            r = await fetch('/criteria/' + this.selected.id, {
              method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
          } else {
            r = await fetch('/criteria', {
              method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
          }
          if (r.ok) {
            const updated = await r.json();
            this.selected = updated;
            await this.load();
            this.saveMsg = 'Saved!';
            setTimeout(() => this.saveMsg = '', 2000);
          } else {
            const d = await r.json(); this.error = d.detail || 'Save failed';
          }
        } finally { this.saving = false; }
      },
      async saveSchema() {
        this.schemaSaving = true; this.schemaError = ''; this.schemaSaveMsg = '';
        try {
          const body = {
            name: this.schemaEditName,
            description: this.schemaEditDesc,
            gse_labels: this.schemaEditGseLabels,
            gsm_labels: this.schemaEditGsmLabels
          };
          let r;
          if (this.selectedSchema.id) {
            r = await fetch('/annotation-schemas/' + this.selectedSchema.id, {
              method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
          } else {
            r = await fetch('/annotation-schemas', {
              method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
          }
          if (r.ok) {
            const updated = await r.json();
            this.selectedSchema = updated;
            await this.loadSchemas();
            this.schemaSaveMsg = 'Saved!';
            setTimeout(() => this.schemaSaveMsg = '', 2000);
          } else {
            const d = await r.json(); this.schemaError = d.detail || 'Save failed';
          }
        } finally { this.schemaSaving = false; }
      },
      async deleteCriteria() {
        if (!confirm('Delete this criteria template?')) return;
        await fetch('/criteria/' + this.selected.id, {method: 'DELETE'});
        this.selected = null;
        await this.load();
      },
      async deleteSchema() {
        if (!confirm('Delete this annotation schema?')) return;
        await fetch('/annotation-schemas/' + this.selectedSchema.id, {method: 'DELETE'});
        this.selectedSchema = null;
        await this.loadSchemas();
      },
      async loadPrompt() {
        if (!this.selectedSchema || !this.selectedSchema.id) return;
        this.promptLoading = true;
        try {
          const r = await fetch(`/annotation-schemas/${this.selectedSchema.id}/prompts/${this.selectedPromptType}`);
          if (r.ok) {
            const data = await r.json();
            this.promptContent = data.content;
          }
        } catch (e) {
          console.error('Failed to load prompt:', e);
        } finally {
          this.promptLoading = false;
        }
      },
      async savePrompt() {
        if (!this.selectedSchema || !this.selectedSchema.id) return;
        this.promptSaving = true;
        try {
          const r = await fetch(`/annotation-schemas/${this.selectedSchema.id}/prompts/${this.selectedPromptType}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: this.promptContent})
          });
          if (r.ok) {
            this.schemaSaveMsg = 'Prompt saved!';
            setTimeout(() => this.schemaSaveMsg = '', 2000);
          } else {
            this.schemaError = 'Failed to save prompt';
          }
        } finally {
          this.promptSaving = false;
        }
      }
    }
  }
</script>
{% endblock %}
