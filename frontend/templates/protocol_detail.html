{% extends "base.html" %}
{% block title %}Protocol 工作台 — GEO Screener v2{% endblock %}
{% block content %}
<script src="/static/protocols.js"></script>
<style>[x-cloak]{display:none!important}.protocol-input{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:6px 8px;font-size:12px;background:white}.protocol-btn{padding:7px 11px;border:1px solid #d1d5db;border-radius:7px;font-size:12px;background:white}.protocol-btn:disabled{opacity:.4;cursor:not-allowed}.protocol-pane{min-width:0;background:white;border:1px solid #e5e7eb;border-radius:12px}.protocol-layout{display:grid;grid-template-columns:190px minmax(380px,1fr) minmax(270px,.65fr);gap:14px}@media(max-width:1250px){.protocol-layout{grid-template-columns:170px minmax(350px,1fr)}.protocol-evidence{grid-column:2}}@media(max-width:900px){.protocol-layout{display:flex;flex-direction:column}}</style>
<div x-data="protocolDetail({{ job_id }})" x-cloak>
  <div class="flex justify-between items-start gap-4 mb-5 flex-wrap">
    <div><a href="/protocols" class="text-xs text-blue-600">← Protocol 提取任务</a><h1 class="text-xl font-semibold mt-2" x-text="job.name || 'Protocol 工作台'"></h1><a :href="'/tasks/'+job.source_task_id+'/detail'" class="text-xs text-gray-500">查看来源筛选任务 ↗</a></div>
    <div class="flex gap-2 flex-wrap"><button class="protocol-btn" @click="runJob()" :disabled="busy">批量提取待处理项</button><button class="protocol-btn" @click="runJob(true)" :disabled="busy">重试失败项</button><button class="protocol-btn text-blue-700" @click="download(false)">导出已复核 TSV</button><details class="relative"><summary class="protocol-btn cursor-pointer">更多导出</summary><div class="absolute right-0 z-20 bg-white border shadow rounded p-2 w-44 space-y-2"><button class="protocol-btn w-full" @click="download(true)">草稿 TSV</button><button class="protocol-btn w-full" @click="download(false,'evidence')">已复核证据 JSON</button><button class="protocol-btn w-full" @click="download(true,'evidence')">草稿证据 JSON</button><button class="protocol-btn w-full" @click="download(true,'issues')">待确认项 JSON</button></div></details></div>
  </div>
  <p x-show="error" x-text="error" class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg" role="alert"></p>
  <p x-show="notice" x-text="notice" class="mb-4 p-3 bg-blue-50 text-blue-700 text-sm rounded-lg" role="status"></p>
  <div class="protocol-layout">
    <aside class="protocol-pane p-3 self-start"><p class="text-xs font-medium text-gray-500 p-2" x-text="'来源文献 · '+job.items.length"></p><div class="space-y-2 max-h-[75vh] overflow-y-auto"><template x-for="entry in job.items" :key="entry.id"><button @click="openItem(entry.id)" class="text-left w-full rounded-lg p-3 border" :class="currentId===entry.id?'bg-blue-50 border-blue-300':'border-transparent hover:bg-gray-50'"><p class="font-mono text-xs text-blue-700" x-text="entry.dataset_id"></p><p class="text-xs mt-1 line-clamp-2" x-text="entry.title"></p><p class="text-xs mt-2" :class="entry.status==='failed'?'text-red-600':'text-gray-500'" x-text="label(entry.status)"></p><span x-show="entry.stale" class="text-xs text-amber-700">长时间无进度，可重试</span></button></template></div></aside>
    <section class="protocol-pane p-4 self-start">
      <template x-if="item"><div>
        <div class="flex items-center justify-between gap-2"><span class="font-mono text-blue-700 text-sm" x-text="item.dataset_id"></span><span class="text-xs rounded-full bg-gray-100 px-3 py-1" x-text="label(item.status)"></span></div>
        <h2 class="font-semibold mt-2 mb-3 text-sm" x-text="item.title"></h2>
        <p x-show="item.error" x-text="item.error" class="text-xs text-amber-700 bg-amber-50 rounded p-2 mb-3"></p>
        <div class="flex gap-2 flex-wrap mb-4"><button class="protocol-btn" @click="runItem(false)" :disabled="busy || (active() && !item.stale)">获取正文 PDF</button><button class="protocol-btn bg-blue-600 text-blue-700" @click="runItem(true)" :disabled="busy || (active() && !item.stale)" x-text="item.revisions.length?'重新提取为新版本':'开始提取'"></button></div>
        <details class="border rounded-lg mb-4" :open="!item.documents.length"><summary class="text-xs px-3 py-2 cursor-pointer" x-text="'来源材料（'+item.documents.length+'） · 上传正文 / 补充材料'"></summary>
          <div class="p-3 border-t space-y-2"><p class="text-xs text-gray-500">支持 PDF、TXT、MD，每份最多 30 MB。扫描件请先 OCR；表格可转为 PDF。引用来源请注明与目标论文的关系。</p><input type="file" x-ref="material" accept=".pdf,.txt,.md" class="text-xs w-full" :disabled="busy || active()"/><div class="flex gap-2"><select x-model="uploadKind" class="protocol-input"><option value="main">正文</option><option value="supplement">补充材料</option><option value="reference">引用来源</option></select><button class="protocol-btn whitespace-nowrap" @click="upload()" :disabled="busy || active()">上传材料</button></div><input x-model="uploadReference" class="protocol-input" placeholder="来源 DOI / 引用编号及采用关系（引用来源必填）"/><template x-for="doc in item.documents" :key="doc.id"><div class="text-xs border-t pt-2"><button class="text-blue-600 break-all text-left" @click="showDocument(doc.id,1)" x-text="doc.name+' · '+doc.pages+' 页'"></button><p class="text-gray-500" x-text="doc.reference"></p><template x-for="warning in doc.warnings"><p class="text-amber-700" x-text="warning"></p></template></div></template></div>
        </details>
        <div x-show="!draft" class="bg-gray-50 rounded-lg p-6 text-sm text-gray-500 leading-relaxed">添加材料后点击“开始提取”。系统会整理扰动与培养时间，并为每条记录保留原文证据。<button class="block text-blue-600 mt-3" @click="addRow()" :disabled="!item.documents.length || active()">或手动整理第一条记录</button></div>
        <template x-if="draft"><div>
          <div class="flex items-center gap-2 mb-3"><label class="text-xs whitespace-nowrap">结果版本</label><select class="protocol-input" x-model="revisionId" @change="changeRevision()" :disabled="dirty || busy"><template x-for="rev in item.revisions" :key="rev.id"><option :value="rev.id" x-text="'#'+rev.id+' · '+(rev.source==='human'?'人工修订':'机器提取')+(rev.reviewed?' · 已复核':' · 草稿')+(rev.id===item.active_revision_id?' · 当前':'')"></option></template></select></div>
          <div class="border rounded-lg p-3 mb-3 space-y-2" @input="dirty=true" @change="dirty=true"><label class="block text-xs text-gray-500">提取结论</label><select x-model="draft.outcome" class="protocol-input"><option value="extracted">已提取 Protocol</option><option value="no_protocol">材料中未找到 Protocol</option><option value="needs_sources">需要补充来源</option></select><textarea class="protocol-input" rows="2" x-model="draft.summary" placeholder="说明提取结果或材料限制"></textarea><template x-for="(ref,index) in draft.reference_requests" :key="index"><div class="flex gap-2"><input class="protocol-input" x-model="draft.reference_requests[index]"/><button class="text-xs text-red-600" @click="draft.reference_requests.splice(index,1);dirty=true">已解决</button></div></template><button class="text-xs text-blue-600" @click="draft.reference_requests.push('需要补充的引用或材料：');dirty=true">+ 添加待补来源</button></div>
          <div x-show="draft.blockers?.length" class="p-3 bg-red-50 rounded mb-3"><p class="text-xs font-medium text-red-700">复核前需解决</p><template x-for="issue in draft.blockers"><p class="text-xs text-red-700 mt-1" x-text="issue"></p></template></div>
          <details x-show="draft.warnings?.length" class="mb-3"><summary class="text-xs text-amber-700 cursor-pointer" x-text="'待确认项 · '+(draft.warnings?.length || 0)"></summary><template x-for="issue in draft.warnings"><p class="text-xs text-amber-700 mt-1" x-text="issue"></p></template></details>
          <div class="flex gap-2 justify-between mb-2"><select class="protocol-input max-w-xs" x-model="protocolFilter"><option value="">全部 Protocol / 实验组</option><template x-for="group in groups()"><option :value="group" x-text="group"></option></template></select><button class="protocol-btn whitespace-nowrap" @click="addRow()" :disabled="active()">+ 添加记录</button></div>
          <div class="overflow-x-auto border rounded-lg"><table class="text-xs w-full"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-2 text-left">Protocol / GSM</th><th class="p-2 text-left">扰动</th><th class="p-2 text-left">剂量</th><th class="p-2 text-left">时间</th><th class="p-2">操作</th></tr></thead><tbody><template x-for="row in visibleRows()" :key="row.index"><tr class="border-t cursor-pointer" :class="selectedRow===row.index?'bg-blue-50':'hover:bg-gray-50'" @click="chooseRow(row.index)"><td class="p-2"><span x-text="row.event.protocol_name"></span><p class="text-gray-400 font-mono" x-text="row.event.values.GSM_id"></p></td><td class="p-2" x-text="row.event.values.Pert_name==='NA'?row.event.values.Addition_context:row.event.values.Pert_name"></td><td class="p-2 whitespace-nowrap" x-text="row.event.values.dose_value+' '+row.event.values.dose_unit"></td><td class="p-2 whitespace-nowrap" x-text="row.event.values.time_pert_start+' → '+row.event.values.time_pert_end"></td><td class="p-2"><button class="text-blue-600" @click.stop="chooseRow(row.index)">编辑</button><button class="text-red-500 ml-2" @click.stop="removeRow(row.index)" :disabled="active()">删除</button></td></tr></template></tbody></table></div>
          <template x-if="selected()"><div class="mt-4 border rounded-lg p-3" @input="dirty=true" @change="dirty=true"><h3 class="text-xs font-semibold mb-3" x-text="'编辑记录 '+(selectedRow+1)"></h3><label class="block text-xs text-gray-500 mb-1">Protocol / 实验组名称</label><input class="protocol-input mb-3" x-model="selected().protocol_name"/><div class="grid grid-cols-2 gap-3"><template x-for="key in job.columns" :key="key"><label class="text-[11px] text-gray-500 break-all"><span x-text="key"></span><input class="protocol-input mt-1" x-model="selected().values[key]" :disabled="key==='GSE_id' || active()"/></label></template></div><div class="mt-4"><div class="flex justify-between"><h4 class="text-xs font-semibold">原文证据</h4><button class="text-xs text-blue-600" @click="addEvidence()">+ 添加证据</button></div><template x-for="(ev,index) in selected().evidence" :key="index"><div class="mt-2 bg-gray-50 p-2 rounded space-y-2"><div class="flex gap-2"><select class="protocol-input" x-model.number="ev.document_id"><template x-for="doc in item.documents" :key="doc.id"><option :value="doc.id" x-text="doc.name"></option></template></select><input aria-label="证据页码" class="protocol-input" style="width:70px" type="number" min="1" x-model.number="ev.page"/></div><textarea class="protocol-input" rows="3" x-model="ev.quote" placeholder="复制对应页中的原文片段"></textarea><button class="text-xs text-blue-600" @click="showDocument(ev.document_id,ev.page)">查看原文</button><button class="text-xs text-red-600 ml-3" @click="selected().evidence.splice(index,1);dirty=true">移除</button></div></template></div></div></template>
          <div class="sticky bottom-0 bg-white border-t mt-4 pt-3 pb-1 flex gap-2 items-center"><button class="protocol-btn" @click="save(false)" :disabled="busy || active()">保存修订</button><button class="protocol-btn text-blue-700 font-medium" @click="save(true)" :disabled="busy || active()">保存并标记已复核</button><span class="text-xs text-amber-700" x-show="dirty">有未保存修改</span></div>
        </div></template>
      </div></template>
    </section>
    <aside class="protocol-pane protocol-evidence p-4 self-start sticky top-4"><h2 class="text-sm font-semibold mb-3">来源证据</h2><template x-if="item && item.documents.length"><div><select class="protocol-input mb-2" x-model.number="docId" @change="showDocument(docId,1)"><template x-for="doc in item.documents" :key="doc.id"><option :value="doc.id" x-text="doc.name"></option></template></select><div class="flex items-center gap-2 text-xs mb-3"><span>页码</span><input class="protocol-input" style="width:65px" type="number" min="1" :max="document()?.pages" x-model.number="page" @change="showDocument(docId,page)"/><a :href="fileUrl()" target="_blank" rel="noopener" class="text-blue-600">打开原文件 ↗</a></div><template x-if="document()?.name.toLowerCase().endsWith('.pdf')"><iframe :src="fileUrl()" title="原始 PDF" class="w-full border rounded mb-3" style="height:400px"></iframe></template><p class="text-xs text-gray-500 mb-2">本页提取文本 · 对照原文件核查表格与版面</p><pre class="text-xs whitespace-pre-wrap break-words bg-gray-50 rounded p-3 max-h-[55vh] overflow-y-auto font-sans leading-relaxed" x-text="sourceText"></pre></div></template><p x-show="!item?.documents.length" class="text-xs text-gray-500 leading-relaxed">上传正文或补充材料后，这里将显示原文。点击提取记录可定位对应证据。</p></aside>
  </div>
</div>
{% endblock %}
