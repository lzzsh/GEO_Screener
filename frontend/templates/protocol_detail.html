{% extends "base.html" %}
{% block title %}{{ t('Protocol 工作台 — GEO Screener v2') }}{% endblock %}
{% block content %}
<script src="/static/protocols.js"></script>

<div x-data="protocolDetail({{ job_id }})" class="protocol-page" @ui:language-change.window="if ((dirty) &amp;&amp; !confirm(tr('切换语言将重新加载页面，是否放弃未保存修改？'))) $event.preventDefault()" x-cloak>
  <div class="page-heading">
    <div><a href="/protocols" class="text-xs text-blue-600">{{ t('← Protocol 提取任务') }}</a><h1 class="text-xl font-semibold mt-2" x-text="job.name || (tr(&quot;Protocol 工作台&quot;))"></h1><a :href="'/tasks/'+job.source_task_id+'/detail'" class="text-xs text-gray-500">{{ t('查看来源筛选任务 ↗') }}</a></div>
    <div class="flex gap-2 flex-wrap"><button class="protocol-btn" @click="runJob()" :disabled="busy">{{ t('批量提取待处理项') }}</button><button class="protocol-btn" @click="runJob(true)" :disabled="busy">{{ t('重试失败项') }}</button><button class="protocol-btn protocol-btn--primary" @click="download(false)">{{ t('导出已复核 TSV') }}</button><details class="relative"><summary class="protocol-btn cursor-pointer">{{ t('更多导出') }}</summary><div class="absolute right-0 z-20 bg-white border shadow rounded p-2 w-44 space-y-2"><button class="protocol-btn w-full" @click="download(true)">{{ t('草稿 TSV') }}</button><button class="protocol-btn w-full" @click="download(false,'evidence')">{{ t('已复核证据 JSON') }}</button><button class="protocol-btn w-full" @click="download(true,'evidence')">{{ t('草稿证据 JSON') }}</button><button class="protocol-btn w-full" @click="download(true,'issues')">{{ t('待确认项 JSON') }}</button></div></details></div>
  </div>
  <p x-show="error" x-text="tr(error)" class="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg" role="alert"></p>
  <p x-show="notice" x-text="tr(notice)" class="mb-4 p-3 bg-blue-50 text-blue-700 text-sm rounded-lg" role="status"></p>
  <p class="ui-help mb-3" x-text="job.extraction_unit==='gsm'?tr('每个 GSM 独立提取和复核；同一文献共享 Methods 与补充材料。'):tr('这是文献级旧版本；请从筛选任务新建 GSM 提取任务。')"></p>
  <div class="protocol-layout">
    <aside class="protocol-pane protocol-source-list"><p class="pane-heading" x-text="(job.extraction_unit==='gsm'?tr('GSM 样本 ·'):tr('文献级旧版本 ·'))+' '+job.items.length"></p><div class="space-y-2 max-h-[75vh] overflow-y-auto"><template x-for="entry in job.items" :key="entry.id"><button @click="openItem(entry.id)" class="text-left w-full rounded-lg p-3 border" :class="currentId===entry.id?'bg-blue-50 border-blue-300':'border-transparent hover:bg-gray-50'"><p class="font-mono text-xs text-blue-700" x-text="entry.gsm_id ? entry.gsm_id+' · '+entry.dataset_id : entry.dataset_id"></p><p class="text-xs mt-1 line-clamp-2" x-text="entry.title"></p><p class="text-xs mt-2" :class="entry.status==='failed'?'text-red-600':'text-gray-500'" x-text="label(entry.status)"></p><span x-show="entry.stale" class="text-xs text-amber-700">{{ t('长时间无进度，可重试') }}</span></button></template></div></aside>
    <section class="protocol-pane p-5 self-start"><div class="flex items-center justify-between mb-4"><h2 class="text-sm font-semibold">{{ t('提取与复核') }}</h2><span class="ui-badge ui-badge--blue">02</span></div>
      <template x-if="item"><div>
        <div class="flex items-center justify-between gap-2"><span class="font-mono text-blue-700 text-sm" x-text="item.gsm_id ? item.gsm_id+' · '+item.dataset_id : item.dataset_id"></span><span class="text-xs rounded-full bg-gray-100 px-3 py-1" x-text="label(item.status)"></span></div>
        <h2 class="font-semibold mt-2 mb-3 text-sm" x-text="item.title"></h2>
        <p x-show="item.error" x-text="tr(item.error)" class="text-xs text-amber-700 bg-amber-50 rounded p-2 mb-3"></p>
        <div class="flex gap-2 flex-wrap mb-4"><button class="protocol-btn" @click="runItem(false)" :disabled="busy || (active() && !item.stale)">{{ t('获取 Methods 与补充材料') }}</button><button class="protocol-btn protocol-btn--primary" @click="runItem(true)" :disabled="busy || (active() && !item.stale)" x-text="item.revisions.length?(tr(&quot;重新提取为新版本&quot;)):(tr(&quot;开始提取&quot;))"></button></div>
        <details class="border rounded-lg mb-4" :open="!item.documents.length"><summary class="text-xs px-3 py-2 cursor-pointer" x-text="(tr(&quot;来源材料（&quot;))+item.documents.length+(tr(&quot;） · 上传正文 / 补充材料&quot;))"></summary>
          <div class="p-3 border-t space-y-2"><p class="text-xs text-gray-500">{{ t('支持 PDF、TXT、MD、DOCX、XLSX、CSV、TSV、ZIP，每份最多 30 MB。扫描件请先 OCR。引用来源请注明采用关系。') }}</p><input type="file" x-ref="material" accept=".pdf,.txt,.md,.docx,.xlsx,.csv,.tsv,.zip" class="text-xs w-full" :disabled="busy || active()"/><div class="flex gap-2"><select x-model="uploadKind" class="protocol-input"><option value="main">{{ t('正文') }}</option><option value="supplement">{{ t('补充材料') }}</option><option value="reference">{{ t('引用来源') }}</option></select><button class="protocol-btn whitespace-nowrap" @click="upload()" :disabled="busy || active()">{{ t('上传材料') }}</button></div><input x-model="uploadReference" class="protocol-input" placeholder="{{ t('来源 DOI / 引用编号及采用关系（引用来源必填）') }}"/><template x-for="doc in item.documents" :key="doc.id"><div class="text-xs border-t pt-2"><button class="text-blue-600 break-all text-left" @click="showDocument(doc.id,1)" x-text="doc.name+' · '+doc.pages+(&quot; &quot;+tr(&quot;页 / 节&quot;))"></button><p class="text-gray-500" x-text="doc.reference"></p><template x-for="warning in doc.warnings"><p class="text-amber-700" x-text="warning"></p></template></div></template></div>
        </details>
        <details class="border rounded-lg mb-4" x-show="item.material_coverage?.length"><summary class="text-xs px-3 py-2 cursor-pointer">{{ t('模型输入覆盖清单') }}</summary><div class="p-3 border-t space-y-2 text-xs"><p class="text-gray-500">{{ t('PDF 使用页码；Word、Excel 和 Methods 文本使用节或工作表编号。原始文件保留供核对。') }}</p><p class="text-amber-700" x-text="item.materials_manifest?.collection_error"></p><template x-for="(entry,index) in item.material_coverage" :key="index"><p><span x-text="entry.included?'✓ ':'— '"></span><span x-text="entry.name+' · '+(entry.page || '')"></span><span class="text-gray-500" x-text="' · '+tr(entry.reason)"></span></p></template><template x-for="(entry,index) in (item.materials_manifest?.inventory || []).filter(e=>['unavailable','parse_failed','unsupported'].includes(e.status))" :key="index"><p class="text-amber-700" x-text="entry.name+' · '+tr(entry.reason)"></p></template></div></details>
        <div x-show="!draft" class="bg-gray-50 rounded-lg p-6 text-sm text-gray-500 leading-relaxed">{{ t('添加材料后点击“开始提取”。系统会整理扰动与培养时间，并为每条记录保留原文证据。') }}<button class="block text-blue-600 mt-3" @click="addRow()" :disabled="!item.documents.length || active()">{{ t('或手动整理第一条记录') }}</button></div>
        <template x-if="draft"><div>
          <div class="flex items-center gap-2 mb-3"><label class="text-xs whitespace-nowrap">{{ t('结果版本') }}</label><select class="protocol-input" x-model="revisionId" @change="changeRevision()" :disabled="dirty || busy"><template x-for="rev in item.revisions" :key="rev.id"><option :value="rev.id" x-text="'#'+rev.id+' · '+(rev.source==='human'?(tr(&quot;人工修订&quot;)):(tr(&quot;机器提取&quot;)))+(rev.reviewed?(&quot; &quot;+tr(&quot;· 已复核&quot;)):(&quot; &quot;+tr(&quot;· 草稿&quot;)))+(rev.id===item.active_revision_id?(&quot; &quot;+tr(&quot;· 当前&quot;)):'')"></option></template></select></div>
          <div class="border rounded-lg p-3 mb-3 space-y-2" @input="dirty=true" @change="dirty=true"><label class="block text-xs text-gray-500">{{ t('提取结论') }}</label><select x-model="draft.outcome" class="protocol-input"><option value="extracted">{{ t('已提取 Protocol') }}</option><option value="no_protocol">{{ t('材料中未找到 Protocol') }}</option><option value="needs_sources">{{ t('需要补充来源') }}</option></select><textarea class="protocol-input" rows="2" x-model="draft.summary" placeholder="{{ t('说明提取结果或材料限制') }}"></textarea><template x-for="(ref,index) in draft.reference_requests" :key="index"><div class="flex gap-2"><input class="protocol-input" x-model="draft.reference_requests[index]"/><button class="text-xs text-red-600" @click="draft.reference_requests.splice(index,1);dirty=true">{{ t('已解决') }}</button></div></template><button class="text-xs text-blue-600" @click="draft.reference_requests.push((tr(&quot;需要补充的引用或材料：&quot;)));dirty=true">{{ t('+ 添加待补来源') }}</button></div>
          <div x-show="draft.blockers?.length" class="p-3 bg-red-50 rounded mb-3"><p class="text-xs font-medium text-red-700">{{ t('复核前需解决') }}</p><template x-for="issue in draft.blockers"><p class="text-xs text-red-700 mt-1" x-text="tr(issue)"></p></template></div>
          <details x-show="draft.warnings?.length" class="mb-3"><summary class="text-xs text-amber-700 cursor-pointer" x-text="(tr(&quot;待确认项 ·&quot;)+&quot; &quot;)+(draft.warnings?.length || 0)"></summary><template x-for="issue in draft.warnings"><p class="text-xs text-amber-700 mt-1" x-text="tr(issue)"></p></template></details>
          <div class="flex gap-2 justify-between mb-2"><select class="protocol-input max-w-xs" x-model="protocolFilter"><option value="">{{ t('全部 Protocol / 实验组') }}</option><template x-for="group in groups()"><option :value="group" x-text="group"></option></template></select><button class="protocol-btn whitespace-nowrap" @click="addRow()" :disabled="active()">{{ t('+ 添加记录') }}</button></div>
          <div class="overflow-x-auto border rounded-lg"><table class="text-xs w-full"><thead class="bg-gray-50 text-gray-500"><tr><th class="p-2 text-left">Protocol / GSM</th><th class="p-2 text-left">{{ t('扰动') }}</th><th class="p-2 text-left">{{ t('剂量') }}</th><th class="p-2 text-left">{{ t('时间') }}</th><th class="p-2">{{ t('操作') }}</th></tr></thead><tbody><template x-for="row in visibleRows()" :key="row.index"><tr class="border-t cursor-pointer" :class="selectedRow===row.index?'bg-blue-50':'hover:bg-gray-50'" @click="chooseRow(row.index)"><td class="p-2"><span x-text="row.event.protocol_name"></span><p class="text-gray-400 font-mono" x-text="row.event.values.GSM_id"></p></td><td class="p-2" x-text="row.event.values.Pert_name==='NA'?row.event.values.Addition_context:row.event.values.Pert_name"></td><td class="p-2 whitespace-nowrap" x-text="row.event.values.dose_value+' '+row.event.values.dose_unit"></td><td class="p-2 whitespace-nowrap" x-text="row.event.values.time_pert_start+' → '+row.event.values.time_pert_end"></td><td class="p-2"><button class="text-blue-600" @click.stop="chooseRow(row.index)">{{ t('编辑') }}</button><button class="text-red-500 ml-2" @click.stop="removeRow(row.index)" :disabled="active()">{{ t('删除') }}</button></td></tr></template></tbody></table></div>
          <template x-if="selected()"><div class="mt-4 border rounded-lg p-3" @input="dirty=true" @change="dirty=true"><h3 class="text-xs font-semibold mb-3" x-text="(tr(&quot;编辑记录&quot;)+&quot; &quot;)+(selectedRow+1)"></h3><label class="block text-xs text-gray-500 mb-1">{{ t('Protocol / 实验组名称') }}</label><input class="protocol-input mb-3" x-model="selected().protocol_name"/><template x-for="group in fieldGroups()" :key="group.title"><fieldset class="border-t mt-4 pt-3"><legend class="text-xs font-semibold px-1" x-text="group.title"></legend><div class="protocol-editor-fields"><template x-for="key in group.keys" :key="key"><label><span x-text="fieldLabel(key)"></span><input class="protocol-input" x-model="selected().values[key]" :disabled="key==='GSE_id' || active()"/></label></template></div></fieldset></template><div class="mt-4"><div class="flex justify-between"><h4 class="text-xs font-semibold">{{ t('原文证据') }}</h4><button class="text-xs text-blue-600" @click="addEvidence()">{{ t('+ 添加证据') }}</button></div><template x-for="(ev,index) in selected().evidence" :key="index"><div class="mt-2 bg-gray-50 p-2 rounded space-y-2"><div class="flex gap-2"><select class="protocol-input" x-model.number="ev.document_id"><template x-for="doc in item.documents" :key="doc.id"><option :value="doc.id" x-text="doc.name"></option></template></select><input aria-label="{{ t('证据页码') }}" class="protocol-input" style="width:70px" type="number" min="1" x-model.number="ev.page"/></div><textarea class="protocol-input" rows="3" x-model="ev.quote" placeholder="{{ t('复制对应页中的原文片段') }}"></textarea><button class="text-xs text-blue-600" @click="showDocument(ev.document_id,ev.page)">{{ t('查看原文') }}</button><button class="text-xs text-red-600 ml-3" @click="selected().evidence.splice(index,1);dirty=true">{{ t('移除') }}</button></div></template></div></div></template>
          <div class="protocol-save-bar sticky bottom-0 bg-white border-t mt-4 pt-3 pb-1 flex gap-2 items-center"><button class="protocol-btn" @click="save(false)" :disabled="busy || active()">{{ t('保存修订') }}</button><button class="protocol-btn protocol-btn--primary" @click="save(true)" :disabled="busy || active()">{{ t('保存并标记已复核') }}</button><span class="text-xs text-amber-700" x-show="dirty">{{ t('有未保存修改') }}</span></div>
        </div></template>
      </div></template>
    </section>
    <aside class="protocol-pane protocol-evidence p-5 self-start"><div class="flex items-center justify-between mb-4"><h2 class="text-sm font-semibold">{{ t('来源证据') }}</h2><span class="ui-badge">03</span></div><template x-if="item && item.documents.length"><div><select class="protocol-input mb-2" x-model.number="docId" @change="showDocument(docId,1)"><template x-for="doc in item.documents" :key="doc.id"><option :value="doc.id" x-text="doc.name"></option></template></select><div class="flex items-center gap-2 text-xs mb-3"><span>{{ t('页 / 节') }}</span><input class="protocol-input" style="width:65px" type="number" min="1" :max="document()?.pages" x-model.number="page" @change="showDocument(docId,page)"/><a :href="fileUrl()" target="_blank" rel="noopener" class="text-blue-600">{{ t('打开原文件 ↗') }}</a></div><div class="ui-actions mb-3" role="group" aria-label="{{ t('来源证据') }}"><button class="ui-button" :class="evidenceMode==='text'?'ui-button--quiet':''" @click="evidenceMode='text'" :aria-pressed="evidenceMode==='text'">{{ t('逐页文本') }}</button><button class="ui-button" x-show="document()?.name.toLowerCase().endsWith('.pdf')" :class="evidenceMode==='pdf'?'ui-button--quiet':''" @click="evidenceMode='pdf'" :aria-pressed="evidenceMode==='pdf'">{{ t('PDF 预览') }}</button></div><p x-show="evidenceMode==='pdf'" class="ui-help mb-2">{{ t('若浏览器无法预览，请打开原文件。') }}</p><template x-if="evidenceMode==='pdf' && document()?.name.toLowerCase().endsWith('.pdf')"><iframe :src="fileUrl()" title="{{ t('原始 PDF') }}" class="w-full border rounded mb-3" style="height:400px"></iframe></template><p class="text-xs text-gray-500 mb-2">{{ t('本页提取文本 · 对照原文件核查表格与版面') }}</p><pre class="text-xs whitespace-pre-wrap break-words bg-gray-50 rounded p-3 max-h-[55vh] overflow-y-auto font-sans leading-relaxed" x-text="sourceText"></pre></div></template><p x-show="!item?.documents.length" class="text-xs text-gray-500 leading-relaxed">{{ t('上传正文或补充材料后，这里将显示原文。点击提取记录可定位对应证据。') }}</p></aside>
  </div>
</div>
{% endblock %}
