<div class="language-switch" role="group" aria-label="{{ t('Language') }}">
  <button type="button" onclick="setUiLanguage('zh')" aria-pressed="{{ 'true' if ui_lang == 'zh' else 'false' }}" lang="zh">中文</button>
  <button type="button" onclick="setUiLanguage('en')" aria-pressed="{{ 'true' if ui_lang == 'en' else 'false' }}" lang="en">English</button>
</div>
