{% extends "base.html" %}
{% block title %}Tasks — GEO Screener{% endblock %}
{% block content %}
<div x-data="tasksPage()" x-init="load()">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Screening Tasks</h1>
      <p class="text-sm text-gray-500 mt-1">Tasks are now created from the Search workspace after you inspect GEO candidates.</p>
    </div>
    <a href="/search" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-medium">
      Go to Search
    </a>
  </div>

  <div x-show="loading" class="text-gray-400 text-sm">Loading…</div>
  <div x-show="!loading && tasks.length === 0" class="text-gray-400 text-sm">No tasks yet.</div>

  <div class="space-y-3">
    <template x-for="t in tasks" :key="t.id">
      <div class="bg-white rounded-xl border border-gray-200 px-5 py-4 hover:border-blue-300 transition">
        <div class="flex items-center justify-between">
          <a :href="'/tasks/' + t.id + '/detail'" class="min-w-0 flex-1">
            <p class="font-medium" x-text="t.name"></p>
            <p class="text-xs text-blue-600 mt-1 truncate" x-show="t.search_query" x-text="t.search_query"></p>
            <p class="text-xs text-gray-400 mt-1" x-text="new Date(t.created_at).toLocaleString()"></p>
          </a>
          <div class="flex items-center gap-3">
            <a :href="'/tasks/' + t.id + '/detail'" class="text-right">
              <span :class="statusClass(t.status)"
                    class="text-xs font-semibold px-2 py-1 rounded-full" x-text="t.status"></span>
              <p class="text-xs text-gray-400 mt-1" x-text="`${t.processed} / ${t.total} screened`"></p>
              <p class="text-xs text-gray-400 mt-1" x-text="`${t.candidate_count || t.total} candidates · ${t.included_count || 0} included`"></p>
            </a>
            <button type="button"
                    @click="deleteTask(t)"
                    :disabled="deletingId === t.id"
                    class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-red-200 text-red-600 hover:bg-red-50 disabled:opacity-50"
                    :title="'Delete ' + t.name"
                    aria-label="Delete task">
              <span x-show="deletingId !== t.id">×</span>
              <span x-show="deletingId === t.id">…</span>
            </button>
          </div>
        </div>
        <div x-show="t.status === 'running'" class="mt-3">
          <div class="w-full bg-gray-100 rounded-full h-1.5">
            <div class="bg-blue-500 h-1.5 rounded-full transition-all"
                 :style="'width:' + (t.total ? Math.round(t.processed/t.total*100) : 0) + '%'"></div>
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
  function tasksPage() {
    return {
      tasks: [], loading: true, deletingId: null,
      async readError(response, fallback) {
        const text = await response.text();
        try {
          const payload = JSON.parse(text);
          return payload.detail || fallback;
        } catch (e) {
          return text || fallback;
        }
      },
      async load() {
        this.loading = true;
        const r = await fetch('/tasks');
        if (r.status === 401) { window.location.href = '/login'; return; }
        if (!r.ok) {
          alert(await this.readError(r, '任务列表加载失败'));
          this.loading = false;
          return;
        }
        this.tasks = await r.json();
        this.loading = false;
      },
      async deleteTask(task) {
        if (!confirm('确认删除任务“' + task.name + '”及其所有筛选结果？')) return;
        this.deletingId = task.id;
        const r = await fetch('/tasks/' + task.id, {method: 'DELETE'});
        if (r.status === 401) { window.location.href = '/login'; return; }
        if (!r.ok) {
          alert(await this.readError(r, '任务删除失败'));
          this.deletingId = null;
          return;
        }
        this.tasks = this.tasks.filter(t => t.id !== task.id);
        this.deletingId = null;
      },
      statusClass(s) {
        return {
          pending:  'bg-gray-100 text-gray-600',
          running:  'bg-blue-100 text-blue-700',
          done:     'bg-green-100 text-green-700',
          error:    'bg-red-100 text-red-700',
        }[s] || 'bg-gray-100 text-gray-600';
      }
    }
  }
</script>
{% endblock %}
