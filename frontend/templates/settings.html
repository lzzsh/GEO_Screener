{% extends "base.html" %}
{% block title %}Settings — GEO Screener{% endblock %}
{% block content %}
<div x-data="settingsPage()" x-init="load()">
  <h1 class="text-2xl font-bold mb-6">LLM Settings</h1>

  <div class="flex gap-6 items-start">

    <!-- Left: Active model -->
    <div class="w-80 flex-shrink-0">
      <h2 class="text-base font-semibold mb-3 text-gray-700">Active Model</h2>
      <div class="bg-white rounded-xl border border-gray-200 p-5 space-y-4">
        <div x-show="activeSaveMsg" class="text-green-600 text-sm" x-text="activeSaveMsg"></div>
        <div>
          <label class="block text-sm font-medium mb-1">Provider</label>
          <select x-model="activeForm.provider" @change="onActiveProviderChange()"
                  class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <template x-for="p in ALL_PROVIDERS" :key="p.value">
              <option :value="p.value" x-text="p.label + (providerConfigs[p.value] && providerConfigs[p.value].has_key ? '' : ' (no key)')"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Model</label>
          <input x-model="activeForm.model" type="text"
                 class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Temperature
            <span class="text-gray-400 font-normal" x-text="'(' + activeForm.temperature + ')'"></span>
          </label>
          <input x-model.number="activeForm.temperature" type="range" min="0" max="1" step="0.05" class="w-full" />
        </div>
        <div class="flex gap-3">
          <button @click="saveActive()" :disabled="activeSaving"
                  class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
            <span x-text="activeSaving ? 'Saving…' : 'Save'"></span>
          </button>
          <button @click="testConn()" :disabled="testing"
                  class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 disabled:opacity-50">
            <span x-text="testing ? 'Testing…' : 'Test Connection'"></span>
          </button>
        </div>
        <div x-show="testResult !== null">
          <span x-show="testResult === true" class="text-green-600 text-sm font-medium">✓ Connection successful</span>
          <span x-show="testResult === false" class="text-red-600 text-sm font-medium" x-text="testError"></span>
        </div>
      </div>
    </div>

    <!-- Right: Provider credentials -->
    <div class="flex-1 min-w-0">
      <h2 class="text-base font-semibold mb-3 text-gray-700">Provider Credentials</h2>
      <div class="space-y-2">
        <template x-for="p in ALL_PROVIDERS" :key="p.value">
          <div class="bg-white rounded-xl border px-4 py-3 flex items-start gap-3"
               :class="providerConfigs[p.value] && providerConfigs[p.value].has_key ? 'border-gray-200' : 'border-dashed border-gray-200 opacity-40'">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-sm font-medium text-gray-800" x-text="p.label"></span>
                <span x-show="providerConfigs[p.value] && providerConfigs[p.value].has_key"
                      class="text-xs text-green-600">✓ key</span>
              </div>
              <div class="text-xs text-gray-500 font-mono truncate"
                   x-text="providerConfigs[p.value] ? providerConfigs[p.value].effective_base_url : PROVIDER_EFFECTIVE_URLS[p.value]"></div>
              <div class="text-xs text-gray-400 mt-0.5"
                   x-show="providerConfigs[p.value] && providerConfigs[p.value].model"
                   x-text="'model: ' + (providerConfigs[p.value] && providerConfigs[p.value].model || '')"></div>
            </div>
            <button @click="openModal(p.value)"
                    class="text-xs text-blue-600 hover:text-blue-800 flex-shrink-0 mt-0.5">Edit</button>
          </div>
        </template>
      </div>
    </div>

  </div>

  <!-- Edit credentials modal -->
  <div x-show="modal.open" x-cloak
       class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
       @click.self="modal.open = false">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md mx-4 p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-semibold" x-text="'Edit: ' + (ALL_PROVIDERS.find(p => p.value === modal.provider) || {}).label"></h3>
        <button @click="modal.open = false" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
      </div>

      <div x-show="modal.saveMsg" class="text-green-600 text-sm" x-text="modal.saveMsg"></div>
      <div x-show="modal.error" class="text-red-600 text-sm" x-text="modal.error"></div>

      <div x-show="modal.provider === 'custom'">
        <label class="block text-sm font-medium mb-1">Base URL</label>
        <input x-model="modal.base_url" type="url" placeholder="https://api.example.com/v1"
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>
      <div x-show="modal.provider !== 'custom'">
        <label class="block text-sm font-medium mb-1 text-gray-500">Endpoint</label>
        <div class="w-full border border-gray-100 rounded-lg px-3 py-2 bg-gray-50 text-sm text-gray-600 font-mono break-all"
             x-text="PROVIDER_EFFECTIVE_URLS[modal.provider] || '—'"></div>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">
          API Key
          <span x-show="providerConfigs[modal.provider] && providerConfigs[modal.provider].has_key"
                class="ml-2 text-xs text-green-600 font-normal">✓ Key saved</span>
        </label>
        <input x-model="modal.api_key" type="password" placeholder="Leave blank to keep existing key"
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <div class="flex gap-3 pt-1">
        <button @click="saveModal()" :disabled="modal.saving"
                class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50">
          <span x-text="modal.saving ? 'Saving…' : 'Save'"></span>
        </button>
        <button @click="modal.open = false"
                class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg text-sm font-medium hover:bg-gray-200">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  const PROVIDER_MODELS = {
    deepseek: 'deepseek-chat', glm: 'glm-4', minimax: 'abab6.5s-chat',
    'campus-minimax': 'minimax', 'campus-glm': 'glm', custom: ''
  };
  const PROVIDER_EFFECTIVE_URLS = {
    deepseek: 'https://api.deepseek.com/v1',
    glm: 'https://open.bigmodel.cn/api/paas/v4',
    minimax: 'https://api.minimax.chat/v1',
    'campus-minimax': 'http://10.28.0.22:30530/v1',
    'campus-glm': 'http://10.28.0.22:30530/v1',
    custom: ''
  };
  const ALL_PROVIDERS = [
    {value: 'deepseek', label: 'DeepSeek'},
    {value: 'glm', label: 'GLM (Zhipu)'},
    {value: 'minimax', label: 'MiniMax'},
    {value: 'campus-minimax', label: '校内 MiniMax'},
    {value: 'campus-glm', label: '校内 GLM'},
    {value: 'custom', label: 'Custom'},
  ];

  function settingsPage() {
    return {
      providerConfigs: {},
      activeForm: {provider: 'deepseek', model: 'deepseek-chat', temperature: 0.1},
      activeSaving: false, activeSaveMsg: '',
      modal: {open: false, provider: '', api_key: '', base_url: '', saving: false, saveMsg: '', error: ''},
      testing: false, testResult: null, testError: '',

      async load() {
        const r = await fetch('/llm/config');
        if (r.status === 401) { window.location.href = '/login'; return; }
        if (r.ok) {
          const d = await r.json();
          this.providerConfigs = d.provider_configs || {};
          this.activeForm = {provider: d.provider, model: d.model || '', temperature: d.temperature ?? 0.1};
        }
      },

      onActiveProviderChange() {
        const saved = this.providerConfigs[this.activeForm.provider];
        this.activeForm.model = (saved && saved.model) || PROVIDER_MODELS[this.activeForm.provider] || '';
        this.testResult = null;
      },

      openModal(provider) {
        const saved = this.providerConfigs[provider] || {};
        this.modal = {open: true, provider, api_key: '', base_url: saved.base_url || '',
                      saving: false, saveMsg: '', error: ''};
      },

      async saveModal() {
        this.modal.saving = true; this.modal.error = ''; this.modal.saveMsg = '';
        const body = {provider: this.modal.provider, base_url: this.modal.base_url,
                      model: (this.providerConfigs[this.modal.provider] || {}).model || PROVIDER_MODELS[this.modal.provider] || '',
                      temperature: (this.providerConfigs[this.modal.provider] || {}).temperature ?? 0.1};
        if (this.modal.api_key.trim()) body.api_key = this.modal.api_key.trim();
        const r = await fetch('/llm/credentials', {
          method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        this.modal.saving = false;
        if (r.ok) {
          const d = await r.json();
          this.providerConfigs = d.provider_configs || {};
          this.modal.api_key = '';
          this.modal.saveMsg = 'Saved!';
          setTimeout(() => { this.modal.saveMsg = ''; this.modal.open = false; }, 800);
        } else {
          const d = await r.json(); this.modal.error = d.detail || 'Save failed';
        }
      },

      async saveActive() {
        this.activeSaving = true; this.activeSaveMsg = '';
        const body = {provider: this.activeForm.provider, model: this.activeForm.model, temperature: this.activeForm.temperature};
        const r = await fetch('/llm/config', {
          method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        this.activeSaving = false;
        if (r.ok) {
          const d = await r.json();
          this.providerConfigs = d.provider_configs || {};
          this.activeSaveMsg = 'Saved!'; setTimeout(() => this.activeSaveMsg = '', 2000);
        }
      },

      async testConn() {
        this.testing = true; this.testResult = null; this.testError = '';
        const r = await fetch('/llm/test', {method: 'POST'});
        this.testing = false;
        if (r.ok) { this.testResult = true; }
        else { this.testResult = false; const d = await r.json(); this.testError = d.detail || 'Connection failed'; }
      }
    }
  }
</script>
{% endblock %}
